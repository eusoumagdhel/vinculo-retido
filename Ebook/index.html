<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa dos Vínculos</title>
<meta name="description" content="Mapa dos Vínculos: o e-book interativo para brasileiros que vivem fora.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* Layout: one reading column, one block per screen, sticky progress on top. Dark, single theme, like the e-book. */
:root{--bg:#0A0A0A;--card:#15130F;--card2:#1B170F;--gold:#D4A937;--gold2:#E0BF66;--goldd:#8C6F2A;--txt:#ECE7DD;--mut:#A9A398;--line:#3A3221;
--serif:"Playfair Display",Georgia,serif;--sans:"Open Sans",system-ui,-apple-system,sans-serif;color-scheme:dark;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:400 17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.top b{font:700 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.bar{flex:1;height:6px;border-radius:9px;background:#221e16;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.top span{font-size:.78rem;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
main{padding-block:28px 40px;min-height:70vh}
.eb{display:block;font:700 .74rem/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
h1,h2,h3{font-family:var(--serif);color:var(--gold);text-wrap:balance;margin:0 0 .6em}
h1{font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.15}h2{font-size:1.45rem;line-height:1.25}h3{font-size:1.12rem;line-height:1.3}
p{margin:0 0 1em}
.q{font:italic 500 1.18rem/1.55 var(--serif);color:var(--gold2);border-left:2px solid var(--gold);padding-left:16px;margin:1.4em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin:14px 0}
.card.g{border-color:var(--goldd);background:var(--card2)}
.card h3{margin-bottom:.35em}.card p{color:var(--mut);font-size:.96rem;margin:0 0 .5em}.card p:last-child{margin:0}.card p.w{color:var(--txt)}
.cover{text-align:center;padding-top:28px}
.cover img{width:min(280px,72%);height:auto;display:block;margin:10px auto}
.cover .t{font:700 clamp(2.4rem,11vw,3.4rem)/1 var(--serif);color:var(--gold);letter-spacing:.02em}
.cover .s{font:italic 500 1.05rem var(--serif);color:var(--gold2);margin-top:10px}
.cover .l{font:italic 500 1.25rem/1.5 var(--serif);color:var(--gold);margin:38px 0 6px}
.cover small{display:block;color:var(--mut);font-size:.82rem;margin-top:30px}
.ex{border:1px solid var(--goldd);border-radius:16px;padding:20px 18px;margin:28px 0 0;background:#0F0D0A}
.ex .head{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.ex .head p{color:var(--mut);font-size:.92rem;margin:0}
.qt{margin:0 0 20px}.qt label{display:block;font-weight:700;color:var(--gold);font-size:.86rem}
.qt p{margin:2px 0 10px;font-size:1rem;line-height:1.5}
.sc{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.sc button{aspect-ratio:1;min-width:0;border-radius:50%;border:1px solid var(--goldd);background:transparent;color:var(--txt);font:700 .8rem/1 var(--sans);cursor:pointer;padding:0;transition:background .15s,transform .15s}
.sc button:hover{border-color:var(--gold)}.sc button[aria-pressed="true"]{background:var(--gold);color:#0A0A0A;border-color:var(--gold);transform:scale(1.08)}
.sc button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.scl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mut);margin-top:5px}
.tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;font-weight:700}
.tot output{font:700 1.3rem var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}
textarea,input[type=text]{width:100%;background:var(--card);border:1px solid var(--goldd);border-radius:10px;color:var(--txt);font:400 1rem/1.5 var(--sans);padding:12px}
textarea{min-height:110px;resize:vertical}textarea:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px}
.open label{display:block;font:700 .74rem/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 4px}
.open p{font-size:1rem;line-height:1.5;margin:0 0 10px}
.note{color:var(--mut);font-size:.88rem}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:100px;border:1px solid var(--gold);padding:14px 22px;font:700 .86rem/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;background:transparent;color:var(--gold);text-align:center}
.btn.p{background:var(--gold);color:#0A0A0A}.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}.btn[hidden]{display:none}
.btn.full{width:100%;padding:17px}
.toc{list-style:none;padding:0;margin:0}.toc li{margin:0}
.toc button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:400 1rem var(--sans);padding:13px 2px;cursor:pointer}
.toc button b{font-family:var(--serif);color:var(--gold);min-width:22px}.toc button em{margin-left:auto;font-style:normal;font-size:.78rem;color:var(--mut)}
.toc button em.ok{color:var(--gold)}
.res{display:grid;gap:10px;margin:18px 0}
.ar{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ar.hi{border-color:var(--gold);background:var(--card2)}
.ar span{font-weight:600}.ar output{font:700 1.15rem var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}
.ar .m{grid-column:1/-1;height:6px;border-radius:9px;background:#221e16;overflow:hidden}.ar .m i{display:block;height:100%;background:var(--gold)}
.big{text-align:center;margin:22px 0}.big output{display:block;font:700 3.4rem/1 var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}.big small{color:var(--mut)}
.band{border-left:3px solid var(--gold);background:var(--card);padding:14px 16px;border-radius:0 12px 12px 0}
.miss{color:#E7B65A;font-size:.9rem}
.priv{font-size:.82rem;color:var(--mut);text-align:center;margin-top:26px}
footer{border-top:1px solid var(--line);padding:26px 0 36px;text-align:center;color:var(--mut);font-size:.8rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

1:{t:"O que você aprendeu a chamar de normal?",qs:["Em algum momento, quanto você sente vontade de largar tudo e voltar para o Brasil?","Quanto sua cabeça volta para o Brasil enquanto você tenta viver o seu dia no país onde mora hoje?","Quanto você sente que sua vida está funcionando por fora, mas você não está se sentindo tão bem por dentro?"],open:"Em que momento do dia sua cabeça mais volta para o Brasil? O que costuma acontecer logo antes?"},

3:{t:"A conta que não aparece no extrato",qs:["Quanto da sua vida hoje está concentrado em resolver, cumprir e aguentar, em vez de viver e aproveitar?","Quanto você sente que está adiando coisas importantes esperando ter mais tempo, energia, dinheiro ou tranquilidade?","Quanto você sente que os próximos anos poderiam ser diferentes se conseguisse viver onde está hoje com mais presença e tranquilidade?"],open:"Escreva uma coisa importante que você está adiando “para quando tiver tempo”. Há quanto tempo ela está esperando?",note:"Você já tem três partes do seu mapa."},

var STEPS=[
{id:"capa",name:"Capa",html:function(){return '<div class="cover"><div class="t">MAPA DOS</div><img src="'+EMBLEM+'" alt="" width="400" height="187"><div class="t">VÍNCULOS</div><div class="s">Uma vida entre dois lugares.</div><div class="l">Um mapa de reflexão para quem<br>construiu uma vida fora</div><small>E-BOOK INTERATIVO · Magdiel Negrão</small></div>'}},
{id:"inicio",name:"Como usar",html:function(){return '<h1>Você construiu uma vida fora.</h1>'+q('Então, por que ainda sente que uma parte sua ficou no Brasil?')+P('Uma nova forma de entender a saudade, a culpa e a sensação de viver entre dois lugares, sem precisar escolher entre a vida que você construiu e as pessoas que continuam fazendo parte dela.')+c('Como usar este mapa',['!São seis blocos curtos. Leia no seu ritmo, de uma vez ou em vários dias.','!Cada bloco termina com um exercício: três perguntas com nota de 0 a 10 e uma pergunta para escrever. Toque no número para marcar.','!O mapa soma tudo sozinho. No final, você descobre qual área pesa mais hoje e pode enviar seu resultado para a Sessão Individual de Análise.'])+c('Suas respostas ficam com você',['Tudo o que você marca e escreve fica salvo só neste aparelho e neste navegador. Ninguém vê, a não ser que você mesmo envie. Se trocar de celular ou limpar o navegador, as respostas não vão junto.'])+'<h2 style="margin-top:28px">O que você vai encontrar</h2>'+toc()}},
{id:"b1",name:"Bloco 1",ex:1,html:function(){return '<span class="eb">Bloco 1</span><h1>Bem por fora. Mas não tão bem por dentro?</h1>'+P('Você trabalha. Paga suas contas. Construiu uma vida fora do Brasil. Por fora, parece que deu certo.','Mas existe um momento, geralmente quando o dia termina, em que sua cabeça volta para lá.','Às vezes acontece dentro do carro, depois do trabalho. Você estaciona, fica alguns minutos em silêncio e começa a pensar na família. Às vezes, quando chega uma mensagem do Brasil: você fica feliz em ver aquele nome na tela e, depois da conversa, vem a saudade.','Ou quando você vê uma foto. Um aniversário. Uma notícia da família. Um áudio. Ou quando pensa nos seus pais envelhecendo e percebe que está longe.','E existe uma pergunta que talvez você não diga para ninguém:')+q('“Será que estou perdendo coisas importantes enquanto construo minha vida aqui?”')+P('Você pode gostar da vida que construiu. Pode reconhecer que morar fora trouxe oportunidades. Pode saber que fez a escolha certa naquele momento. Ainda assim, alguma coisa incomoda. Você descansa, mas a cabeça continua ocupada. Pega o celular à noite e passa mais tempo do que gostaria olhando mensagens, vídeos ou notícias do Brasil. Está presente fisicamente onde mora, mas uma parte da atenção continua em outro lugar.','E existe algo ainda mais difícil de explicar. Você sente saudade do Brasil, mas também sabe que não quer simplesmente voltar. Sente falta de pessoas. De lugares. De costumes. De uma versão sua que existia lá. Ao mesmo tempo, existe uma vida acontecendo aqui. E você ficou no meio dessas duas coisas.','Você aprendeu a chamar tudo isso de normal. Afinal, escolheu morar fora. Precisa trabalhar. Precisa seguir. Então continua.')+q('Só que continuar não significa necessariamente estar inteiro onde está.')}},
{id:"b2",name:"Bloco 2",ex:2,html:function(){return '<span class="eb">Bloco 2</span><h1>Talvez não seja apenas cansaço</h1>'+P('Você pode olhar para sua rotina e encontrar uma explicação simples: “Estou cansado porque trabalho muito.” E talvez isso seja verdade. Mas observe o que acontece quando você finalmente tem tempo para descansar.')+q('Seu corpo para. Sua cabeça continua.')+P('Você pega o celular. Responde alguém. Olha uma mensagem do Brasil. Vê uma foto. Entra em uma rede social. Quando percebe, passou mais uma hora. E no dia seguinte acorda cansado outra vez.','Existe outro detalhe. As conversas com a família podem ser boas e difíceis ao mesmo tempo. Você escuta a voz de alguém que ama e sente alegria. Depois que a conversa termina, sente saudade. Pensa nos seus pais. Pensa no tempo passando. Pensa em tudo que acontece enquanto você está longe.','Pode aparecer preocupação. Pode aparecer culpa. Pode aparecer aquela sensação de que deveria estar lá. E então você volta para a rotina. Trabalho. Casa. Contas. Você segue funcionando. Mas existe uma parte da sua vida que ainda não encontrou um lugar tranquilo dentro dessa nova rotina.')+c('Você está aqui.',['Mas pensa lá.'])+c('Ama as pessoas que ficaram.',['Mas precisa viver onde está.'])+c('Construiu uma nova vida.',['Mas sente falta de quem era antes dela.'])+P('Talvez seja justamente essa divisão que você ainda não conseguiu nomear. Isso não significa que você não se adaptou. Não significa que escolheu errado. Não significa que ama menos a vida que construiu. Significa apenas que existe mais coisa acontecendo dentro de você do que aquela palavra simples, “cansaço”, consegue explicar.')}},
{id:"b3",name:"Bloco 3",ex:3,html:function(){return '<span class="eb">Bloco 3</span><h1>O preço de deixar tudo como está</h1>'+P('Existe um custo que não aparece no extrato bancário. É o custo de passar meses ou anos apenas administrando a própria vida. Você trabalha. Resolve problemas. Cumpre compromissos. Ajuda quem precisa. Mantém as coisas funcionando. E vai deixando algumas partes da sua vida para depois.')+q('“Quando eu tiver mais tempo.” “Quando eu estiver menos cansado.” “Quando as coisas melhorarem.”')+P('O problema é que esse depois pode durar muito tempo. Você talvez já tenha percebido isso em coisas pequenas. Um encontro que deixou de marcar. Uma viagem que ficou para depois. Um projeto que perdeu força. Um momento com alguém que ama em que você estava presente só pela metade. Ou aquela sensação de chegar ao fim da semana e perceber que fez muita coisa, mas quase não viveu nada.')+q('Quanto da sua vida atual você está apenas administrando, quando poderia estar vivendo?')+P('Você não precisa estar em crise para perceber isso. Às vezes, o incômodo aparece justamente porque a vida está funcionando. As contas estão pagas. O trabalho anda. A rotina continua. Só que você sabe que poderia viver esses anos de outra maneira: com mais presença, mais tranquilidade e mais espaço para aproveitar a vida que você mesmo construiu.')}},
{id:"b4",name:"Bloco 4",ex:4,html:function(){return '<span class="eb">Bloco 4 · A virada</span><h1>O vínculo retido</h1>'+P('Até aqui, talvez você tenha tentado entender tudo por partes. Cansaço. Saudade. Preocupação. Culpa. Dificuldade para descansar. Sensação de não pertencer completamente. Mas existe outra forma de olhar para esse conjunto.','Imagine que você mudou de país, construiu uma nova rotina e continuou seguindo sua vida. Só que algumas partes importantes da sua história continuaram emocionalmente ligadas ao que ficou no Brasil. Sua família. Pessoas que você ama. Lugares. Memórias. Responsabilidades. Uma versão sua. Planos que ficaram pelo caminho.','É isso que chamamos aqui de <b>vínculo retido</b>. Não é um diagnóstico. Não é uma doença. Não significa que existe algo errado com você. É uma forma de nomear um padrão e ajudar a compreender uma experiência difícil de explicar.','Seu corpo mudou de país. Mas uma parte da sua vida emocional continuou ligada ao que ficou. E existe uma razão para isso. Você precisou continuar conectado. Telefonar. Mandar mensagem. Participar de aniversários à distância. Saber como seus pais estão. Essas conexões ajudaram você a atravessar a distância. Você aprendeu a ir embora sem abandonar aquilo que ama.','Só que talvez ninguém tenha ensinado a outra parte. Como continuar amando sem permanecer emocionalmente preso ao lugar que ficou para trás. Como construir uma vida nova sem sentir que está traindo a antiga. Como pertencer ao lugar onde está sem deixar de pertencer à sua história.')+q('Você ficou muito bom em continuar conectado. Muito bom em lembrar. Muito bom em se preocupar. Muito bom em seguir em frente sem deixar de olhar para trás.')+P('Pense em uma mala. No começo, você percebe que está carregando. Depois de muitos anos, pode ficar tão acostumado com o peso que deixa de perceber que continua carregando. O objetivo não é jogar a mala fora. É descobrir o que precisa continuar com você e qual é o lugar de cada coisa.')+c('Amar ≠ Estar preso',['Existe uma diferença entre amar o que ficou no Brasil e precisar emocionalmente estar lá para se sentir inteiro.'])+c('Saudade ≠ Ausência',['Existe diferença entre sentir saudade e deixar de viver o momento atual toda vez que pensa na família.'])+c('Raízes ≠ Escolha forçada',['Existe diferença entre manter suas raízes e sentir que precisa escolher entre o Brasil e a vida que construiu fora.'])+q('O ponto não é eliminar a saudade. É continuar conectado sem deixar que essa conexão ocupe o lugar da vida que está acontecendo agora.')}},
{id:"b5",name:"Bloco 5",ex:5,html:function(){function mv(n,t,d,s){return c('<span class="eb">'+n+'</span>'+t,[d])+c('<span class="eb">Primeiro passo</span>',['!'+s],'g')}
return '<span class="eb">Bloco 5 · O caminho</span><h1>Você não precisa escolher entre suas raízes e sua vida atual</h1>'+P('Se o problema não é simplesmente sentir saudade, a saída também não é simplesmente parar de sentir. Você não precisa esquecer o Brasil. Não precisa cortar vínculos. Não precisa fingir que não sente falta. E não precisa decidir entre voltar ou ficar só para acabar com esse conflito.','O caminho tem três movimentos. Para cada um, há um primeiro passo pequeno, que você pode experimentar já nesta semana.')
+mv(1,'Separar amor de culpa','Estar longe não significa abandonar. Construir uma vida fora não apaga tudo o que você fez e faz por quem ficou. Você pode amar sua família e continuar vivendo. Pode prosperar sem transformar cada conquista em uma dívida.','Quando a culpa aparecer, complete por escrito: “Estar longe não apaga que eu…”. Escreva uma coisa concreta que você fez ou faz por quem ficou. A ideia não é convencer você de nada. É colocar a culpa ao lado dos fatos.')
+mv(2,'Estar inteiro onde você está','Você pode manter vínculos com quem ama sem deixar que toda a sua atenção fique presa ao que acontece no Brasil. A questão passa a ser: como continuar conectado e, ao mesmo tempo, estar presente onde sua vida acontece hoje?','Depois de uma chamada de vídeo, antes de pegar o celular de novo, faça uma pausa de dois minutos. Lembre de uma coisa da conversa que fez bem a você. Depois, repare onde você está agora: o cômodo, o barulho, a hora. Só então volte para a rotina. Se você costuma ficar parado no carro antes de entrar em casa, use esse momento do mesmo jeito.')
+mv(3,'Dar um novo lugar ao que ficou','Algumas partes da sua história precisam encontrar um novo lugar. Não para serem apagadas, mas para deixarem de exigir que você volte ao passado para se sentir inteiro. As pessoas continuam importantes. O lugar que elas ocupam na sua vida atual é que pode mudar.','Escolha um costume, um momento ou um jeito de ser do Brasil de que você sente falta. Pergunte: o que disso eu posso trazer para a vida que tenho aqui? Um almoço de domingo com amigos. Uma receita. Uma música. Uma ligação fixa no mesmo dia da semana.')
+P('São passos pequenos. Eles não resolvem tudo, mas mostram na prática o que cada movimento pede. Aprofundar cada um no seu caso é um processo que leva mais tempo.','Duas pessoas podem sentir a mesma saudade e viver conflitos completamente diferentes. Uma está presa à culpa. Outra está preocupada com os pais. Outra sente falta de quem era antes de mudar de país. Por isso, entender o mapa é diferente de entender onde você está dentro dele.')}},
{id:"b6",name:"Bloco 6",html:function(){return '<span class="eb">Bloco 6 · Convite</span><h1>Agora falta olhar para o seu caso</h1>'+P('Você começou este e-book talvez pensando que o que sentia era apenas cansaço. Ou saudade. Ou excesso de trabalho. Ao longo da leitura, você percebeu que pode existir uma ligação entre essas experiências.','Conheceu o vínculo retido, uma forma de compreender o que acontece quando você constrói uma vida em outro país, mas continua emocionalmente ligado a partes importantes da sua história que ficaram no Brasil. Fez cinco exercícios e conheceu três primeiros passos.','Agora você tem resultados nas mãos. Mas números soltos não contam sua história. Uma mesma pontuação pode ter significados diferentes para pessoas diferentes. O que importa é olhar para o conjunto e entender o que ele revela sobre o seu caso.','Para isso existe a sua <b>Sessão Individual de Análise</b>, já incluída na compra. São 30 minutos comigo, Magdiel, olhando para o seu mapa. Na próxima tela, o seu mapa já aparece montado com tudo o que você respondeu.')}},
{id:"mapa",name:"Seu mapa",html:function(){return mapHtml()}},
{id:"sessao",name:"Sua sessão",html:function(){return sessHtml()}}
];

function exTotal(n){var s=0,k=0;for(var i=1;i<=3;i++){var v=st.a[n+'_'+i];if(v!=null){s+=v;k++}}return {s:s,k:k}}
function toc(){var lab=["Bem por fora, mas não por dentro?","Talvez não seja apenas cansaço","O preço de deixar tudo como está","A virada: o vínculo retido","O caminho: três primeiros passos","Convite: agora falta olhar para o seu caso"];
var h='<ul class="toc">';for(var i=0;i<6;i++){var ex=STEPS[i+2].ex,em='';if(ex){var t=exTotal(ex);em=t.k==3?'<em class="ok">✓ feito</em>':(t.k?'<em>'+t.k+'/3</em>':'')}
h+='<li><button type="button" data-go="'+(i+2)+'"><b>'+(i+1)+'</b>'+lab[i]+em+'</button></li>'}
h+='<li><button type="button" data-go="8"><b>◆</b>Seu mapa e sua área mais alta</button></li><li><button type="button" data-go="9"><b>◆</b>Sua Sessão Individual de Análise</button></li></ul>';return h}

function exHtml(n){var e=EX[n];var h='<section class="ex" aria-labelledby="ex'+n+'"><div class="head"><span class="eb">Exercício '+n+'</span><h2 id="ex'+n+'">'+e.t+'</h2><p>Toque no número que melhor representa você agora. 0 = nada, 10 = muito.</p></div>';
e.qs.forEach(function(t,i){var id=n+'_'+(i+1);h+='<div class="qt" role="group" aria-labelledby="l'+id+'"><label id="l'+id+'">Pergunta '+(i+1)+'</label><p>'+t+'</p><div class="sc">';
for(var v=0;v<=10;v++)h+='<button type="button" data-q="'+id+'" data-v="'+v+'" aria-pressed="'+(st.a[id]===v)+'" aria-label="Nota '+v+'">'+v+'</button>';
h+='</div><div class="scl"><span>nada</span><span>muito</span></div></div>'});
var t=exTotal(n);h+='<div class="tot"><span>'+(n==5?'Sua direção':'Resultado')+'</span><output id="t'+n+'">'+(t.k?t.s:'–')+' / 30</output></div>';
h+='<div class="open"><label for="o'+n+'">Para escrever</label><p>'+e.open+'</p><textarea id="o'+n+'" data-t="'+n+'" placeholder="Escreva aqui, do seu jeito.">'+esc(st.t[n]||'')+'</textarea></div>';
if(e.note)h+='<p class="note" style="margin-top:12px">'+e.note+'</p>';return h+'</section>'}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function calc(){var ar=[1,2,3,4].map(function(n){return exTotal(n)});var tot=ar.reduce(function(a,b){return a+b.s},0);var done=ar.every(function(x){return x.k==3});
var mx=Math.max.apply(null,ar.map(function(x){return x.s}));var hi=ar.map(function(x,i){return x.s==mx&&mx>0?i:-1}).filter(function(i){return i>=0});
return {ar:ar,tot:tot,done:done,hi:hi,dir:exTotal(5)}}
function band(t){return t<=30?'As questões avaliadas parecem ocupar um espaço menor na sua experiência atual.':t<=60?'Existe um conjunto de questões que merece ser observado com mais atenção.':t<=90?'Essas questões parecem ocupar um espaço significativo na sua experiência atual.':'O conjunto de respostas indica uma presença muito forte desses temas na sua vida hoje.'}

function mapHtml(){var r=calc();var h='<span class="eb">Autodiagnóstico</span><h1>O mapa do seu vínculo</h1>'+P('Um retrato inicial de como sua vida no exterior está se relacionando com aquilo que ficou no Brasil. Não existe resposta certa ou errada. A ideia é perceber quanto essas questões ocupam espaço na sua vida hoje.');
if(!r.done){var miss=[1,2,3,4].filter(function(n){return exTotal(n).k<3});h+='<p class="miss">Ainda faltam respostas no'+(miss.length>1?'s exercícios ':' exercício ')+miss.join(', ')+'. O mapa abaixo mostra só o que você já marcou.</p>'}
h+='<div class="res">';r.ar.forEach(function(x,i){h+='<div class="ar'+(r.hi.indexOf(i)>=0?' hi':'')+'"><span>'+(i+1)+'. '+AREAS[i].t+'</span><output>'+x.s+' / 30</output><div class="m"><i style="width:'+(x.s/30*100)+'%"></i></div></div>'});h+='</div>';
h+='<div class="big"><small>Sua pontuação do mapa</small><output>'+r.tot+'</output><small>de 120</small></div><div class="band">'+band(r.tot)+'</div>';
h+=c('Sua direção · fora da soma',['O Exercício 5 mostra o quanto você quer mudar: <b style="color:var(--gold)">'+r.dir.s+' / 30</b>. Ele não entra na pontuação.']);
if(r.hi.length){h+='<h2 style="margin-top:30px">Sua área mais alta e por onde começar</h2>'+P('O total diz quanto espaço esses temas ocupam. A área mais alta diz <b>onde</b> o peso está.');
r.hi.forEach(function(i){var A=AREAS[i];h+=c(A.n+'. '+A.t,[A.d,'!<b style="color:var(--gold)">Por onde começar:</b> '+A.s],'g')})}
h+=c('Importante',['Esta pontuação não é um diagnóstico e não é um veredito sobre você. Uma pontuação alta não significa que existe algo errado com você. Uma pontuação baixa também não conta toda a sua história. É um ponto de partida. O que mantém esse padrão no seu caso depende da sua história, e é o que a Sessão Individual de Análise ajuda a enxergar.']);
return h}

function sessHtml(){return '<span class="eb">Seu próximo passo</span><h1>Sua Sessão Individual de Análise</h1>'+P('Ao comprar o Mapa dos Vínculos, você já ganhou uma Sessão Individual de Análise de 30 minutos, sem custo extra. Na conversa, vamos olhar juntos para as suas respostas e entender o que elas revelam sobre o seu caso.','Você não precisa chegar com tudo explicado. Responda as duas perguntas abaixo e envie. O seu mapa vai junto na mensagem.')
+'<div class="open"><label for="tempo">Há quanto tempo você mora fora?</label><input type="text" id="tempo" data-t="tempo" placeholder="Ex.: 6 anos, nos EUA" value="'+esc(st.t.tempo||'')+'"></div>'
+'<div class="open"><label for="peso">O que mais pesa hoje, em uma frase?</label><textarea id="peso" data-t="peso" style="min-height:80px" placeholder="Escreva do seu jeito.">'+esc(st.t.peso||'')+'</textarea></div>'
+'<div style="margin-top:22px"><a class="btn p full" id="wa" href="#" target="_blank" rel="noopener">Agendar minha sessão pelo WhatsApp</a></div>'
+'<p class="note" style="text-align:center;margin-top:10px">Abre o WhatsApp com a mensagem pronta. Você confere antes de enviar.<br>+55 44 9 9953-8127</p>'
+c('Com transparência',['No fim da sessão, se fizer sentido para o seu caso, eu apresento o acompanhamento individual, para quem quer aprofundar esse caminho comigo. Se não fizer sentido, a conversa termina ali, sem compromisso.'])
+'<p class="priv">Suas respostas escritas nos exercícios não são enviadas. Só vai o que aparece na mensagem.</p>'}

function waLink(){var r=calc();var hi=r.hi.map(function(i){return AREAS[i].t}).join(' e ')||'ainda não calculada';
var m='Olá, Magdiel! Fiz o Mapa dos Vínculos e quero agendar minha Sessão Individual de Análise.\n\n'+'• Moro fora há: '+(st.t.tempo||'-')+'\n• Área mais alta: '+hi+'\n• Pontuação do mapa: '+r.tot+'/120\n• Minha direção: '+r.dir.s+'/30\n'
+'• Por área: '+r.ar.map(function(x,i){return (i+1)+') '+x.s}).join(' · ')+'\n• O que mais pesa hoje: '+(st.t.peso||'-');
return 'https://wa.me/'+WA+'?text='+encodeURIComponent(m)}

var app=document.getElementById('app');
function render(focus){var s=STEPS[st.step];var h=s.html();if(s.ex)h+=exHtml(s.ex);
var last=st.step==STEPS.length-1;
h+='<div class="nav"><button type="button" class="btn" id="prev"'+(st.step==0?' hidden':'')+'>← Voltar</button><span></span><button type="button" class="btn p" id="next"'+(last?' hidden':'')+'>'+(st.step==0?'Começar':(!last&&STEPS[st.step+1].id=='mapa'?'Ver meu mapa':'Continuar'))+' →</button></div>';
app.innerHTML=h;var pc=Math.round(st.step/(STEPS.length-1)*100);document.getElementById('pg').style.width=pc+'%';document.getElementById('pct').textContent=s.name;
var wa=document.getElementById('wa');if(wa)wa.href=waLink();
if(focus){window.scrollTo(0,0);app.focus({preventScroll:true})}save()}
function go(n){st.step=Math.max(0,Math.min(STEPS.length-1,n));render(true)}
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.id=='next')return go(st.step+1);if(b.id=='prev')return go(st.step-1);if(b.dataset.go)return go(+b.dataset.go);
if(b.dataset.q){var id=b.dataset.q,v=+b.dataset.v;st.a[id]=v;b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.v===v))});
var n=id.split('_')[0],t=exTotal(n);document.getElementById('t'+n).textContent=t.s+' / 30';save()}});
app.addEventListener('input',function(e){var k=e.target.dataset.t;if(k){st.t[k]=e.target.value;save();var wa=document.getElementById('wa');if(wa)wa.href=waLink()}});
render(false);
</script>
</body></html>
